<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>
    <f:viewAction action="#{adminLoginBean.guard}" />
    <f:viewAction action="#{adminTestBean.load}" />
</f:metadata>

<h:head>
    <title>Admin - Gestion Tests</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
        .table thead th { white-space: nowrap; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 1200px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
            <h2 class="mb-1">🧪 Gestion des Tests</h2>
            <div class="text-muted">Créez et gérez les tests disponibles.</div>
        </div>
		
		<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
	        <h:link value="➕ Ajouter un Test"
	                outcome="addEditTest.xhtml"
	                action="#{adminTestBean.goAdd}"
	                styleClass="btn btn-success"/>
	        <div class="d-flex">
	            <h:link value="← Retour Dashboard"
	                    outcome="adminDashboard.xhtml"
	                    styleClass="btn btn-outline-secondary"/>
	        </div>
		</div>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <h:form>
                <div class="table-responsive">
                    <h:dataTable value="#{adminTestBean.tests}" var="t"
                                 styleClass="table table-striped table-bordered align-middle">

                        <h:column>
                            <f:facet name="header">ID</f:facet>
                            #{t.id}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Titre</f:facet>
                            #{t.titre}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Durée (min)</f:facet>
                            #{t.duree}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Nb Questions</f:facet>
                            #{t.nbQuestions}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Seuil Réussite (%)</f:facet>
                            #{t.seuilReussite}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Max Tentatives</f:facet>
                            #{t.maxTentatives}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Actions</f:facet>
                            <h:commandLink value="Modifier"
                                           action="#{adminTestBean.goEdit(t.id)}"
                                           styleClass="btn btn-sm btn-primary me-2"/>
                            <h:commandLink value="Supprimer"
                                           action="#{adminTestBean.delete(t.id)}"
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce test ?')"
                                           styleClass="btn btn-sm btn-danger"/>
                        </h:column>

                    </h:dataTable>
                </div>
            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
