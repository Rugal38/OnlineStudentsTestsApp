<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Résultat</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <div class="text-center mb-4">
        <h1 class="mb-1">Résultat du test</h1>
        <div class="text-muted">Voici votre résultat final.</div>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                <div>
                    <div class="text-muted">Votre score</div>
                    <div class="display-6 fw-semibold">#{testBean.scoreFinal}</div>
                </div>
                <span class="badge text-bg-primary p-2">✅ Terminé</span>
            </div>

            <div class="border rounded-3 p-3 bg-white">
                <div class="text-muted mb-1">Date passage</div>
                <div class="fw-semibold">
                    <h:outputText value="#{testBean.lastDatePassage}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                    </h:outputText>
                </div>
            </div>

            <hr class="my-4"/>

            <h:form>
                <div class="d-grid">
                    <h:commandButton value="Logout"
                                     action="#{loginBean.logout}"
                                     styleClass="btn btn-danger btn-lg"/>
                </div>
            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
