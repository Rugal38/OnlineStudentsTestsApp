<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Choix du créneau</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
        .table thead th { white-space: nowrap; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 1100px;">

    <!-- En-tête -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-1">📅 Choisissez un créneau disponible</h1>
            <div class="text-muted">Sélectionnez un créneau et confirmez votre choix.</div>
        </div>

        <div class="d-flex gap-2">
            <!-- ✅ Rafraîchir -->
            <h:form>
                <h:commandButton value="🔄 Rafraîchir"
                                 action="#{choixCreneauBean.refresh}"
                                 styleClass="btn btn-outline-primary"/>
            </h:form>

            <!-- ✅ Retour (navigation) -->
            <h:link value="⬅ Retour"
                    outcome="loginSuccess.xhtml"
                    styleClass="btn btn-outline-secondary"/>
        </div>
    </div>

    <!-- Message Flash -->
    <h:panelGroup rendered="#{not empty flash.msg}">
        <div class="alert alert-danger">
            <strong>⚠️</strong> #{flash.msg}
        </div>
    </h:panelGroup>

    <!-- État vide -->
    <h:panelGroup rendered="#{empty choixCreneauBean.creneaux}">
        <div class="alert alert-warning">
            Aucun créneau disponible pour le moment.
        </div>
    </h:panelGroup>

    <!-- Tableau -->
    <h:panelGroup rendered="#{not empty choixCreneauBean.creneaux}">
        <div class="card shadow-sm page-card">
            <div class="card-body p-4">

                <div class="table-responsive">
                    <!-- ✅ Ce formulaire est nécessaire car le bouton "Choisir" est un commandButton -->
                    <h:form id="formChoix">
                        <h:dataTable value="#{choixCreneauBean.creneaux}" var="c"
                                     styleClass="table table-striped table-bordered align-middle">

                            <h:column>
                                <f:facet name="header">Date</f:facet>
                                #{c.dateExam}
                            </h:column>

                            <h:column>
                                <f:facet name="header">Début</f:facet>
                                #{c.heureDebut}
                            </h:column>

                            <h:column>
                                <f:facet name="header">Fin</f:facet>
                                #{c.heureFin}
                            </h:column>

                            <h:column>
                                <f:facet name="header">ID du test</f:facet>
                                <span class="badge text-bg-secondary">#{c.testId}</span>
                            </h:column>

                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <h:commandButton value="Choisir"
                                                 action="#{choixCreneauBean.choisir(c.id)}"
                                                 onclick="return confirm('Confirmer ce créneau ?');"
                                                 styleClass="btn btn-sm btn-primary"/>
                            </h:column>

                        </h:dataTable>
                    </h:form>
                </div>

            </div>
        </div>
    </h:panelGroup>

    <br/><br/>

    <!-- Navigation -->
    <div class="d-flex gap-2">
        <h:link outcome="login.xhtml"
                styleClass="btn btn-outline-primary"
                value="➡️ Aller à la connexion"/>

        <h:link outcome="inscription.xhtml"
                styleClass="btn btn-outline-success"
                value="📝 Nouvelle inscription"/>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
