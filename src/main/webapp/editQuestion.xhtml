<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Modifier Question</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 900px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h2 class="m-0">✏️ Modifier Question</h2>
        <h:link value="⬅ Retour"
                outcome="adminQuestions.xhtml"
                styleClass="btn btn-outline-secondary"/>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <h:form>

                <!-- Messages -->
                <h:messages globalOnly="true" styleClass="alert alert-danger"/>

                <div class="row g-3">

                    <!-- ID -->
                    <div class="col-12 col-md-4">
                        <label class="form-label">ID</label>
                        <div class="form-control bg-light">
                            <h:outputText value="#{adminQuestionBean.form.id}" />
                        </div>
                    </div>

                    <!-- Libellé -->
                    <div class="col-12">
                        <label class="form-label">Libellé</label>
                        <h:inputTextarea value="#{adminQuestionBean.form.libelle}"
                                         required="true"
                                         rows="4"
                                         styleClass="form-control"/>
                    </div>

                    <!-- Matière -->
                    <div class="col-12 col-md-6">
                        <label class="form-label">Matière</label>
                        <h:selectOneMenu value="#{adminQuestionBean.form.matiereId}"
                                         required="true"
                                         styleClass="form-select">
                            <f:selectItem itemLabel="-- Choisir --" itemValue="#{null}" />
                            <f:selectItem itemLabel="JEE" itemValue="1" />
                            <f:selectItem itemLabel="SQL" itemValue="2" />
                            <f:selectItem itemLabel="NodeJS" itemValue="3" />
                            <f:selectItem itemLabel="MongoDB" itemValue="4" />
                            <f:ajax listener="#{adminQuestionBean.onMatiereChange}" render="themeSelect" />
                        </h:selectOneMenu>
                    </div>

                    <!-- Thème -->
                    <div class="col-12 col-md-6">
                        <label class="form-label">Thème</label>
                        <h:selectOneMenu id="themeSelect"
                                         value="#{adminQuestionBean.form.themeId}"
                                         required="true"
                                         styleClass="form-select">
                            <f:selectItem itemLabel="-- Choisir --" itemValue="#{null}" />
                            <f:selectItems value="#{adminQuestionBean.themes}"
                                           var="t"
                                           itemLabel="#{t.nom}"
                                           itemValue="#{t.id}" />
                        </h:selectOneMenu>
                    </div>

                    <!-- Type -->
                    <div class="col-12">
                        <label class="form-label d-block">Type</label>
                        <div class="d-flex gap-4">
                            <h:selectOneRadio value="#{adminQuestionBean.form.type}" required="true">
                                <f:selectItem itemValue="single" itemLabel="single" />
                                <f:selectItem itemValue="multiple" itemLabel="multiple" />
                            </h:selectOneRadio>
                        </div>
                        <div class="form-text">Single = une seule réponse, Multiple = plusieurs réponses.</div>
                    </div>

                    <!-- Test -->
                    <div class="col-12 col-md-6">
                        <label class="form-label">Test</label>
                        <h:selectOneMenu value="#{adminQuestionBean.form.testId}"
                                         styleClass="form-select">
                            <f:selectItem itemLabel="-- Aucun --" itemValue="#{null}" />
                            <f:selectItems value="#{adminQuestionBean.tests}"
                                           var="t"
                                           itemValue="#{t.id}"
                                           itemLabel="#{t.id} - #{t.titre}" />
                        </h:selectOneMenu>
                    </div>

                </div>

                <hr class="my-4"/>

                <div class="d-flex justify-content-end gap-2">
                    <h:commandButton value="Update"
                                     action="#{adminQuestionBean.save}"
                                     styleClass="btn btn-primary"/>

                    <h:commandButton value="Cancel"
                                     action="#{adminQuestionBean.backToList}"
                                     immediate="true"
                                     styleClass="btn btn-outline-secondary"/>
                </div>

            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
