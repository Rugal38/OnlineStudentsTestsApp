<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
    <title>Modifier Créneau</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 900px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h2 class="m-0">✏️ Modifier Créneau</h2>
        <h:link value="⬅ Retour"
                outcome="adminCreneaux.xhtml"
                styleClass="btn btn-outline-secondary"/>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <h:form id="frm">

                <!-- Global errors -->
                <h:messages globalOnly="true" styleClass="alert alert-danger"/>

                <!-- Success/Error message from bean -->
                <h:panelGroup rendered="#{not empty adminCreneauBean.message}">
                    <div class="alert #{adminCreneauBean.success ? 'alert-success' : 'alert-danger'}">
                        <h:outputText value="#{adminCreneauBean.message}" />
                    </div>
                </h:panelGroup>

                <div class="row g-3">

                    <!-- ID -->
                    <div class="col-12 col-md-4">
                        <label class="form-label">ID</label>
                        <h:inputText value="#{adminCreneauBean.id}"
                                     readonly="true"
                                     styleClass="form-control"
                                     style="background:#f3f3f3;"/>
                    </div>

                    <!-- Date -->
                    <div class="col-12 col-md-4">
                        <label class="form-label">Date</label>
                        <h:inputText value="#{adminCreneauBean.dateExam}"
                                     required="true"
                                     pt:type="date"
                                     styleClass="form-control"/>
                    </div>

                    <!-- Test ID -->
                    <div class="col-12 col-md-4">
                        <label class="form-label">Test ID</label>
                        <h:inputText value="#{adminCreneauBean.testId}"
                                     required="true"
                                     styleClass="form-control">
                            <f:convertNumber integerOnly="true" />
                            <f:ajax event="keyup"
                                    listener="#{adminCreneauBean.recomputeHeureFin}"
                                    render="fin msg" />
                        </h:inputText>
                    </div>

                    <!-- Heure début -->
                    <div class="col-12 col-md-6">
                        <label class="form-label">Heure début</label>
                        <h:inputText value="#{adminCreneauBean.heureDebut}"
                                     required="true"
                                     pt:type="time"
                                     pt:step="60"
                                     styleClass="form-control">
                            <f:ajax event="change"
                                    listener="#{adminCreneauBean.recomputeHeureFin}"
                                    render="fin msg" />
                        </h:inputText>
                    </div>

                    <!-- Heure fin (auto) -->
                    <div class="col-12 col-md-6">
                        <label class="form-label">Heure fin (auto)</label>
                        <h:inputText id="fin"
                                     value="#{adminCreneauBean.heureFin}"
                                     readonly="true"
                                     styleClass="form-control"
                                     style="background:#f3f3f3;"/>
                    </div>

                    <!-- Disponible -->
                    <div class="col-12">
                        <div class="form-check mt-2">
                            <h:selectBooleanCheckbox value="#{adminCreneauBean.disponible}"
                                                     id="disp"
                                                     styleClass="form-check-input"/>
                            <label class="form-check-label" for="disp">Disponible</label>
                        </div>
                    </div>

                </div>

                <hr class="my-4"/>

                <div class="d-flex justify-content-end gap-2">
                    <h:commandButton value="Update"
                                     action="#{adminCreneauBean.update}"
                                     styleClass="btn btn-primary"/>

                    <h:commandButton value="Cancel"
                                     action="#{adminCreneauBean.backToList}"
                                     immediate="true"
                                     styleClass="btn btn-outline-secondary"/>
                </div>

                <!-- place to re-render if needed -->
                <h:panelGroup id="msg" />

            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
