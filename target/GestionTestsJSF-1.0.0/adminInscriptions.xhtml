<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Inscriptions</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body class="admin-page">

<f:metadata>
    <f:viewAction action="#{adminInscriptionsBean.load}" />
</f:metadata>

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="m-0">📝 Inscriptions (Candidats)</h2>

        <h:link value="⬅ Retour au tableau de bord"
                outcome="adminDashboard.xhtml"
                styleClass="btn btn-secondary"/>
    </div>

    <!-- Messages -->
    <h:messages globalOnly="true" styleClass="alert alert-info"/>

    <!-- Empty state -->
    <h:panelGroup rendered="#{empty adminInscriptionsBean.candidats}">
        <div class="alert alert-warning mb-0">
            Aucun candidat trouvé.
        </div>
    </h:panelGroup>

    <!-- Table -->
    <h:form id="fList">
        <h:dataTable value="#{adminInscriptionsBean.candidats}" var="c"
                     rendered="#{not empty adminInscriptionsBean.candidats}"
                     styleClass="table table-striped table-bordered align-middle">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{c.id}
            </h:column>

            <h:column>
                <f:facet name="header">Nom</f:facet>
                #{c.nom} #{c.prenom}
            </h:column>

            <h:column>
                <f:facet name="header">Email</f:facet>
                #{c.email}
            </h:column>

            <h:column>
                <f:facet name="header">Code session</f:facet>
                #{c.codeSession}
            </h:column>

            <h:column>
                <f:facet name="header">Créneau actuel</f:facet>
                <h:outputText value="#{adminInscriptionsBean.labelCreneau(c.creneauId)}" />
            </h:column>

            <h:column>
                <f:facet name="header">Affecter / Modifier</f:facet>

                <div class="d-flex gap-2">
                    <h:selectOneMenu value="#{adminInscriptionsBean.selectedCreneauId}"
                                     styleClass="form-select">
                        <f:selectItem itemLabel="-- Choisir un créneau --" itemValue="#{null}" />
                        <f:selectItems value="#{adminInscriptionsBean.creneauxDisponibles}"
                                       var="cr"
                                       itemValue="#{cr.id}"
                                       itemLabel="#{cr.dateExam} #{cr.heureDebut} → #{cr.heureFin} | Test #{cr.testId}" />
                    </h:selectOneMenu>

                    <h:commandButton value="Affecter"
                                     action="#{adminInscriptionsBean.affecter(c.id)}"
                                     styleClass="btn btn-success">
                        <f:ajax execute="@form" render="@form :fList" />
                    </h:commandButton>
                </div>

            </h:column>

        </h:dataTable>
    </h:form>

</div>

<!-- Bootstrap JS (for dropdowns/modals/etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
