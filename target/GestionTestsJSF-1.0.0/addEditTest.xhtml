<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>
    <f:viewAction action="#{adminLoginBean.guard}" />
</f:metadata>

<h:head>
    <title>Admin - #{adminTestBean.editMode ? 'Modifier Test' : 'Ajouter Test'}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 900px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
            <h2 class="mb-1">#{adminTestBean.editMode ? '📝 Modifier Test' : '➕ Ajouter Test'}</h2>
            <div class="text-muted">Gérer les détails et paramètres du test.</div>
        </div>

        <h:link value="⬅ Retour Gestion Tests"
                outcome="adminManageTests.xhtml"
                styleClass="btn btn-outline-secondary"/>
    </div>

    <!-- Bean message -->
    <h:panelGroup rendered="#{not empty adminTestBean.message}">
        <div class="alert #{adminTestBean.success ? 'alert-success' : 'alert-danger'}">
            <h:outputText value="#{adminTestBean.message}" />
        </div>
    </h:panelGroup>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <h:form>

                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label">Titre du test</label>
                        <h:inputText value="#{adminTestBean.form.titre}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="Le titre du test est obligatoire."/>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Date du test</label>
                        <h:inputText value="#{adminTestBean.dateTestString}"
                                     styleClass="form-control"
                                     placeholder="YYYY-MM-DD">
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </h:inputText>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Durée (minutes) <small>(0 = pas de limite)</small></label>
                        <h:inputText value="#{adminTestBean.form.duree}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="La durée est obligatoire.">
                            <f:convertNumber integerOnly="true" />
                        </h:inputText>
                    </div>

                    <hr class="my-4"/>

                    <h4 class="mb-3">Paramètres du test</h4>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nb questions par test</label>
                        <h:inputText value="#{adminTestBean.form.nbQuestions}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="Le nombre de questions est obligatoire.">
                            <f:convertNumber integerOnly="true" />
                        </h:inputText>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Score par question</label>
                        <h:inputText value="#{adminTestBean.form.scoreParQuestion}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="Le score par question est obligatoire.">
                            <f:convertNumber integerOnly="true" />
                        </h:inputText>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Seuil de réussite (%)</label>
                        <h:inputText value="#{adminTestBean.form.seuilReussite}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="Le seuil de réussite est obligatoire.">
                            <f:convertNumber integerOnly="true" />
                        </h:inputText>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Max tentatives</label>
                        <h:inputText value="#{adminTestBean.form.maxTentatives}"
                                     required="true"
                                     styleClass="form-control"
                                     requiredMessage="Le nombre max de tentatives est obligatoire.">
                            <f:convertNumber integerOnly="true" />
                        </h:inputText>
                    </div>

                    <div class="col-12 mt-3">
                        <div class="row g-2">

                            <div class="col-12 col-md-6">
                                <div class="form-check">
                                    <h:selectBooleanCheckbox value="#{adminTestBean.form.shuffleQuestions}"
                                                             id="sq"
                                                             styleClass="form-check-input"/>
                                    <label class="form-check-label" for="sq">Mélanger les Questions</label>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-check">
                                    <h:selectBooleanCheckbox value="#{adminTestBean.form.shuffleReponses}"
                                                             id="sr"
                                                             styleClass="form-check-input"/>
                                    <label class="form-check-label" for="sr">Mélanger les Réponses</label>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-check">
                                    <h:selectBooleanCheckbox value="#{adminTestBean.form.afficherResultatFin}"
                                                             id="arf"
                                                             styleClass="form-check-input"/>
                                    <label class="form-check-label" for="arf">Afficher Résultat à la fin</label>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-check">
                                    <h:selectBooleanCheckbox value="#{adminTestBean.form.afficherCorrection}"
                                                             id="ac"
                                                             styleClass="form-check-input"/>
                                    <label class="form-check-label" for="ac">Afficher Correction</label>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

                <hr class="my-4"/>

                <div class="d-flex justify-content-end gap-2">
                    <h:commandButton value="💾 Enregistrer"
                                     action="#{adminTestBean.save}"
                                     styleClass="btn btn-primary"/>

                    <h:link value="⬅ Annuler"
                            outcome="adminManageTests.xhtml"
                            styleClass="btn btn-outline-secondary"/>
                </div>

            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
