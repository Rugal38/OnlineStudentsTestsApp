<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>
    <f:viewAction action="#{adminLoginBean.guard}" />
    <f:viewAction action="#{adminResultatBean.load}" />
</f:metadata>

<h:head>
    <title>Admin - Résultats</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
        .table thead th { white-space: nowrap; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-4" style="max-width: 1200px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
            <h2 class="mb-1">📊 Résultats + Candidats</h2>
            <div class="text-muted">Liste des résultats avec les informations des candidats.</div>
        </div>

        <h:link value="⬅ Retour Dashboard"
                outcome="adminDashboard.xhtml"
                styleClass="btn btn-outline-secondary"/>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <h:form>
                <div class="table-responsive">
                    <h:dataTable value="#{adminResultatBean.rows}" var="r"
                                 styleClass="table table-striped table-bordered align-middle">

                        <h:column>
                            <f:facet name="header">ID</f:facet>
                            #{r.id}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Date</f:facet>
                            #{r.datePassage}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Résultat</f:facet>
                            <span class="badge text-bg-primary">#{r.score} / #{r.totalQuestions}</span>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Test</f:facet>
                            #{r.testTitre}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Nom</f:facet>
                            #{r.nom}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Prenom</f:facet>
                            #{r.prenom}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Email</f:facet>
                            #{r.email}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Code</f:facet>
                            <span class="badge text-bg-secondary">#{r.codeSession}</span>
                        </h:column>

                    </h:dataTable>
                </div>
            </h:form>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
