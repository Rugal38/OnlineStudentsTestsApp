<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Correction du test</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body { background-color: #f8f9fa; }
        .correction-card { border-radius: 16px; margin-bottom: 1.5rem; }
        .question-libelle { font-weight: bold; font-size: 1.2rem; color: #343a40; }
        .response-item { padding: 0.5rem 0; }
        .correct-response { color: #28a745; font-weight: bold; }
        .selected-response { color: #007bff; }
        .incorrectly-answered { background-color: #f8d7da; border-left: 5px solid #dc3545; padding-left: 10px; }
        .correctly-answered { background-color: #d4edda; border-left: 5px solid #28a745; padding-left: 10px; }
        .no-answer { color: #6c757d; font-style: italic; }
        .alert-info-custom { background-color: #e2f3ff; color: #0056b3; border-color: #b8daff; }
    </style>
</h:head>

<h:body>

<div class="container py-4">

    <div class="text-center mb-4">
        <h1 class="mb-1">Correction du test</h1>
        <div class="text-muted">Revoyez vos réponses et découvrez les corrections.</div>
    </div>

    <h:panelGroup rendered="#{empty testBean.correctionQuestions}">
        <div class="alert alert-info alert-info-custom text-center">
            Aucune correction disponible. Veuillez passer un test en premier.
        </div>
        <div class="text-center mt-3">
            <h:link value="⬅ Retour au Résultat" outcome="resultat.xhtml" styleClass="btn btn-secondary"/>
        </div>
    </h:panelGroup>

    <h:panelGroup rendered="#{not empty testBean.correctionQuestions}">
        <ui:repeat value="#{testBean.correctionQuestions}" var="cq" varStatus="loop">
            <div class="card shadow-sm correction-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="question-libelle">
                            #{loop.index + 1}. #{cq.question.libelle}
                        </div>
                        <h:panelGroup rendered="#{cq.correctlyAnswered}">
                            <span class="badge bg-success">Correct</span>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!cq.correctlyAnswered}">
                            <span class="badge bg-danger">Incorrect</span>
                        </h:panelGroup>
                    </div>

                    <ul class="list-unstyled">
                        <ui:repeat value="#{cq.question.reponses}" var="r">
                            <li class="response-item
                                #{r.correcte ? 'correct-response' : ''}
                                #{cq.candidateSelectedResponseIds.contains(r.id) ? (cq.correctlyAnswered ? 'selected-response' : 'text-danger') : ''}">
                                <i class="me-2
                                    #{r.correcte ? 'bi bi-check-circle-fill' : ''}
                                    #{cq.candidateSelectedResponseIds.contains(r.id) and !r.correcte ? 'bi bi-x-circle-fill' : ''}"></i>
                                #{r.texte}
                            </li>
                        </ui:repeat>
                        <h:panelGroup rendered="#{empty cq.candidateSelectedResponseIds}">
                            <li class="no-answer">Aucune réponse sélectionnée.</li>
                        </h:panelGroup>
                    </ul>
                </div>
            </div>
        </ui:repeat>

        <div class="text-center mt-4">
            <h:link value="⬅ Retour au Résultat" outcome="resultat.xhtml" styleClass="btn btn-secondary"/>
        </div>
    </h:panelGroup>

</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
