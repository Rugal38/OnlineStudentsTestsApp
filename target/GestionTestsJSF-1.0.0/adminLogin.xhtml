<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Admin Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        .page-card { border-radius: 16px; }
    </style>
</h:head>

<h:body class="bg-light">

<div class="container py-5" style="max-width: 520px;">

    <div class="text-center mb-4">
        <h2 class="mb-1">🔐 Admin Login</h2>
        <div class="text-muted">Connectez-vous pour accéder au tableau de bord.</div>
    </div>

    <div class="card shadow-sm page-card">
        <div class="card-body p-4">

            <!-- Messages -->
            <h:messages globalOnly="true" styleClass="alert alert-danger"/>

            <h:form>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <h:inputText value="#{adminLoginBean.username}"
                                 styleClass="form-control"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <h:inputSecret value="#{adminLoginBean.password}"
                                   styleClass="form-control"/>
                </div>

                <div class="d-grid mt-4">
                    <h:commandButton value="Login"
                                     action="#{adminLoginBean.login}"
                                     styleClass="btn btn-primary btn-lg"/>
                </div>
            </h:form>

        </div>
    </div>
<h:button value="👤 Espace Candidat" outcome="inscription.xhtml" styleClass="btn"/>


</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
